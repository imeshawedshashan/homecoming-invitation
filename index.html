
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imesha & Hashan | Homecoming</title>
  <meta property="og:type" content="website">
<meta property="og:title" content="Imesha & Hashan | Homecoming">
<meta property="og:description" content="We are delighted to invite you to celebrate our Homecoming! We would love to have you with us. ❤️">
<meta property="og:image" content="https://raw.githubusercontent.com/imeshawedshashan/homecoming-invitation/main/invitation-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <p id="message">Opening your personal invitation...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const appUrl = 'https://script.google.com/macros/s/AKfycbyvxdY96myPt5TCVlHwDAq19o_Fld5AygXWuMtG8JtpFzvawU0p4tIGrQL6M19nMH6N/exec';

    if (token) {
      window.location.replace(
        appUrl + '?token=' + encodeURIComponent(token)
      );
    } else {
      document.getElementById('message').textContent =
        'Please open your personal invitation link.';
    }
  </script>
</body>
</html>
