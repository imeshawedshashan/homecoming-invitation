
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imesha & Hashan | Homecoming</title>
</head>
<body>
  <p id="message">Opening your personal invitation...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const appUrl = 'https://script.google.com/macros/s/AKfycbyvxdY96myPt5TCVlHwDAq19o_Fld5AygXWuMtG8JtpFzvawU0p4tIGrQL6M19nMH6N/exec';

    if (token) {
      window.location.replace(
        appUrl + '?token=' + encodeURIComponent(token)
      );
    } else {
      document.getElementById('message').textContent =
        'Please open your personal invitation link.';
    }
  </script>
</body>
</html>
